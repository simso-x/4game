<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>วงเหล้า Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#090d1b">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#090d1b;--panel:#141b30;--text:#f4f6ff;--muted:#a8b2cc;--line:rgba(255,255,255,.10);--purple:#8b5cf6;--cyan:#38bdf8;--green:#34d399}
html{min-height:100%;background:var(--bg)}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);min-height:100dvh;padding:20px 14px 40px;background:radial-gradient(ellipse at 10% 0%,#6d28d930,transparent 50%),radial-gradient(ellipse at 100% 35%,#0284c722,transparent 45%),var(--bg);display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-width:0}
h1{font-size:clamp(26px,6vw,36px);font-weight:800;letter-spacing:-.8px;margin:26px 0 22px;text-align:center}
h2{font-size:25px;font-weight:800;margin:24px 0 12px;text-align:center}
input,button{font:inherit}
input{width:100%;padding:17px 18px;color:var(--text);background:#141b30;border:1px solid var(--line);border-radius:17px;margin:7px 0;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#8f9bb7}
input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px #8b5cf61f}
button{width:100%;min-height:48px;padding:15px 18px;border-radius:16px;border:1px solid #ffffff14;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;font-weight:700;box-shadow:0 6px 18px #0003;cursor:pointer;touch-action:manipulation;transition:transform .15s,filter .15s,border-color .15s;margin:6px 0}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{cursor:not-allowed;opacity:.4;box-shadow:none}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
button.alt{background:#19223a;border-color:var(--line);box-shadow:none;color:#dce5ff}
@media(hover:hover){
  button:hover:not(:disabled){filter:brightness(1.12)}
  .game-tile:hover{transform:translateY(-3px);border-color:#a78bfa80}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:19px;background:#141b30cc;backdrop-filter:blur(16px);flex-wrap:wrap}
.top>div:first-child{color:var(--muted);padding:0 4px}
.top b{color:var(--cyan);letter-spacing:1px}
.top .btns{margin-left:auto;display:flex;gap:6px}
.top button{width:auto;min-height:40px;border-radius:12px;font-size:12px;padding:8px 11px;margin:0}
.players{padding:12px 15px;border-radius:14px;background:#ffffff05;color:#b7c3df;overflow-wrap:anywhere;margin:8px 0 10px;font-size:13px}
.center{text-align:center}
.muted{color:var(--muted);opacity:1;line-height:1.8}
.msg{font-size:23px;margin:14px 0;text-align:center;font-weight:bold;overflow-wrap:anywhere}
.lose{color:#fda4af}
.status{text-align:center;font-size:18px;font-weight:bold;margin:15px 0 12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#141b30;color:#c2cce3}
.status.go{background:#34d3990c;border-color:#34d39935;color:#6ee7b7}

/* หน้าเลือกเกม */
.lobby-hero{padding:28px 6px 22px;text-align:center}
.lobby-badge{display:inline-block;padding:6px 12px;border:1px solid #a78bfa40;border-radius:999px;background:#8b5cf615;color:#c4b5fd;font-size:11px;font-weight:800;letter-spacing:2px}
.lobby-hero h1{margin:12px 0 7px}
.lobby-hero p{color:var(--muted);font-size:14px}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
button.game-tile{position:relative;min-height:168px;margin:0;padding:18px 15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:23px;background:radial-gradient(circle at 100% 0%,var(--tile-glow),transparent 75%),#141b30;overflow:hidden}
.game-tile:last-child{grid-column:1 / -1;min-height:150px}
.game-icon{display:grid;place-items:center;width:49px;height:49px;background:#ffffff0c;border:1px solid #ffffff0d;border-radius:16px;font-size:28px;margin-bottom:3px}
.game-title{font-size:18px;font-weight:800}
.game-desc{color:#b5bfd7;font-size:12px;font-weight:400;line-height:1.6}
.game-arrow{position:absolute;top:18px;right:17px;color:#ffffff75;font-size:20px}
.lobby-note{text-align:center;margin:14px 0;color:#8f9bb7;font-size:12px}

/* กล่องคนหลุด */
.offline-box{background:#351827;border:1px solid #fb718560;border-radius:19px;padding:14px;margin:6px 0 12px}
.offline-box .names{color:#fecdd3;overflow-wrap:anywhere;margin-bottom:8px;font-size:14px}
button.clear-btn{background:linear-gradient(135deg,#e11d48,#f43f5e);font-size:17px;padding:12px;margin:0;box-shadow:0 5px 20px #e11d4825}

/* คิว */
.queue{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:14px;margin:8px 0;padding:14px 10px;color:#697795}
.queue span{padding:7px 12px;border-radius:12px;background:#182139;color:#aebbd7;border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.queue span.now{background:linear-gradient(135deg,#a78bfa,#818cf8);color:#11152b;border-color:transparent;box-shadow:0 0 20px #8b5cf62b;font-weight:bold}

/* เปิดไพ่ */
.card{width:min(220px,70vw);height:300px;margin:20px auto;background:#f8fafc;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:72px;font-weight:bold;color:#111;box-shadow:0 20px 50px #0005}
.card.red{color:#d00}
.card.back{border:5px solid #ffffff20;background:repeating-linear-gradient(45deg,#7c3aed 0 12px,#6d28d9 12px 24px)}
.hist{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.hist span{background:#fff;color:#111;border-radius:9px;padding:7px 10px;font-weight:bold}
.hist span.red{color:#d00}

/* รอดหรือร่วง */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}
.deck-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.deck-options button{min-height:72px;margin:0;padding:10px 6px;font-size:clamp(17px,4vw,22px);font-weight:1000;background:linear-gradient(145deg,#11998e,#087f78);box-shadow:0 8px 22px #10b9812e}
.deck-options small{display:block;font-size:12px;opacity:.82;font-weight:700}
.pc{aspect-ratio:3/4;margin:0;padding:4px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 14px #0003;min-height:0;min-width:0}
.pc span{font-size:clamp(28px,8vw,42px);line-height:1}
.pc small{font-size:11px;font-weight:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:white}
.pc.back{background:radial-gradient(circle at 50% 0%,#8b5cf62b,transparent 80%),#1c2342;border:1px solid #a78bfa45;font-size:28px;color:#c4b5fd}
.pc.back:disabled{opacity:.48}
.pc.safe{background:linear-gradient(145deg,#10b981,#047857);border-color:#6ee7b760;opacity:1}
.pc.bad{background:linear-gradient(145deg,#fb7185,#be123c);outline:2px solid #fda4af;outline-offset:2px;opacity:1}
.pc.flip{animation:flip .45s ease-out}
@keyframes flip{from{transform:rotateY(90deg) scale(.9)}to{transform:rotateY(0) scale(1)}}

/* ลูกเต๋า */
.dice{width:min(240px,75vw);min-height:220px;margin:24px auto 15px;display:grid;place-items:center;border:1px solid #a78bfa35;border-radius:35px;background:radial-gradient(circle at 50% 0%,#8b5cf625,transparent 80%),#141b30;box-shadow:0 18px 40px #0004;color:#ddd6fe;font-size:155px;line-height:1}

/* คำเดียวกัน */
.words{display:grid;gap:13px;margin:23px 0}
.words button{margin:0;border-radius:20px;background:linear-gradient(135deg,#252b50,#19223a);border:1px solid #818cf845;padding:25px 18px;font-size:27px}
.words button.mine{outline:2px solid #a78bfa;outline-offset:3px;background:#5b21b6;opacity:1}

/* หยุดเวลา */
.target{text-align:center;margin:22px 0;color:var(--muted);font-size:16px}
.target b{display:block;margin-top:8px;color:#c4b5fd;font-size:clamp(56px,15vw,78px);font-weight:800}
.stopwrap{display:flex;justify-content:center;margin:27px 0}
button.stopbtn{width:min(240px,70vw);height:auto;aspect-ratio:1;border-radius:50%;font-size:36px;margin:0;border:7px solid #ffffff10;box-shadow:0 0 0 10px #ffffff03,0 20px 45px #0005;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button.stopbtn:disabled{opacity:1}
.stopbtn.count{background:linear-gradient(145deg,#312e81,#1e1b4b);color:#ddd6fe;font-size:110px}
.stopbtn.go{background:linear-gradient(145deg,#fb7185,#e11d48)}
.stopbtn.sent{background:linear-gradient(145deg,#059669,#065f46);font-size:24px}
.stopbtn.watch{background:#19223a;color:#a8b2cc;font-size:20px}
table.res{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;border-radius:17px;overflow:hidden;background:#141b30}
.res th{background:#202944;color:#c4b5fd;font-size:13px}
.res th,.res td{padding:13px 6px;text-align:center;overflow-wrap:anywhere}
.res tr.loser td{color:#ff6b6b;font-weight:bold}
.res tr.best td{color:#7ee8a2;font-weight:bold}

/* หน้าลงโทษ */
.modal{position:fixed;inset:0;background:#050816df;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:10;padding:18px}
.box{background:linear-gradient(160deg,#202944,#11182b);color:var(--text);border:1px solid #ffffff20;border-radius:28px;padding:17px;text-align:center;width:100%;max-width:380px;max-height:90dvh;overflow:auto;box-shadow:0 25px 80px #0008}
.box.anim{animation:pop .35s ease-out}
.box img{width:100%;max-height:38dvh;object-fit:contain;background:#090d1b;border-radius:18px;display:block}
.box .fallback{display:none;font-size:80px;line-height:1.3}
.box .name{font-size:29px;font-weight:bold;margin:18px 0 0;color:#f8fafc;word-break:break-word}
.box .ltime{font-size:15px;color:#c2cce3;line-height:1.8;margin-top:5px}
.box .dek{font-size:43px;font-weight:900;color:#fb7185;margin:6px 0 4px;letter-spacing:1px}
.box.anim .dek{animation:shake .5s 2}
.box .mytime{font-size:13px;color:#b5bfd7;margin:8px 0 15px}
.box > button{margin-top:13px;min-height:53px}
.loss-box{width:min(100%,430px);max-height:calc(100dvh - 28px);padding:clamp(15px,4vw,24px);border-radius:24px}
.loss-box img{height:clamp(145px,30dvh,280px);max-height:30dvh;object-fit:contain}
.loss-box .loss-name{font-size:clamp(28px,7vw,38px);font-weight:900;line-height:1.2;margin:13px 0 5px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,#be123c,#fb7185);border:1px solid #fecdd355;border-radius:18px;box-shadow:0 8px 24px #fb718533;overflow-wrap:anywhere;word-break:break-word}
.loss-box .ltime{font-size:18px;font-weight:700;color:#fce7f3;margin-top:5px}
.loss-box .dek{font-size:clamp(34px,9vw,44px);margin:7px 0 4px}
.loss-box .mytime{font-size:15px;margin:7px 0 10px}
@media(max-width:420px){.loss-box{width:100%;padding:15px;border-radius:21px}.loss-box img{height:clamp(130px,26dvh,220px);max-height:26dvh}.loss-box .loss-name{font-size:30px;padding:11px 12px}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:rotate(-5deg) scale(1.1)}75%{transform:rotate(5deg) scale(1.1)}}

.flash{animation:flash .5s 3}
@keyframes flash{50%{background:#e94560}}

@media(max-width:360px){
  body{padding:12px 10px 28px}
  .game-grid{gap:9px}
  button.game-tile{padding:15px 12px}
  .game-title{font-size:16px}
  .grid{gap:7px}
  .pc{border-radius:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}


/* ===== Neon lounge redesign ===== */
:root{--bg:#070814;--panel:#101326;--text:#f7f5ff;--muted:#a8acc8;--line:rgba(171,157,255,.18);--purple:#a855f7;--cyan:#38bdf8;--green:#34d399;--pink:#f43f9e;--gold:#fbbf24}
html{background:#070814}
body{position:relative;isolation:isolate;padding:22px 16px 48px;background:radial-gradient(ellipse at 7% 4%,#7c3aed2b,transparent 34%),radial-gradient(ellipse at 96% 17%,#ec48991b,transparent 29%),radial-gradient(ellipse at 50% 100%,#2563eb12,transparent 42%),#070814}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.17;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
#app{max-width:650px}
h1{letter-spacing:-1px;text-shadow:0 0 34px #a855f72b}
h2{letter-spacing:-.4px;text-shadow:0 0 24px #a855f71c}
.top{padding:11px 12px;background:linear-gradient(135deg,#14172de8,#0d1021e8);border-color:#a78bfa2b;box-shadow:0 12px 35px #0003}
.top>div:first-child{font-size:13px}
.top b{color:#f0abfc;text-shadow:0 0 14px #d946ef55}
.top button{border-radius:11px}
.players{border:1px solid #ffffff0a;background:linear-gradient(120deg,#17172dba,#101326ba);border-radius:14px;padding:12px 15px;color:#c3c8e3}
input{background:#0d1022;border-color:#a5a1d31c;border-radius:15px;padding:16px 17px}
input:focus{border-color:#c084fc;box-shadow:0 0 0 4px #a855f71e}
button{background:linear-gradient(115deg,#d946ef,#8b5cf6 58%,#6366f1);box-shadow:0 8px 25px #8b5cf62a;border:1px solid #ffffff1c;border-radius:15px;font-weight:800;letter-spacing:.05px}
button.alt{background:linear-gradient(135deg,#191d35,#11152a);border-color:#a5a1d32a;color:#e5e7ff}
button:active:not(:disabled){transform:scale(.975)}
.lobby-hero{position:relative;overflow:hidden;padding:30px 18px 27px;margin:16px 0 18px;border:1px solid #b07bff35;border-radius:28px;background:radial-gradient(ellipse at 100% 0%,#ec489929,transparent 48%),radial-gradient(ellipse at 0% 100%,#7c3aed24,transparent 48%),linear-gradient(145deg,#17152b,#0e1020 72%);box-shadow:0 20px 60px #0003,inset 0 1px #ffffff08}
.lobby-hero:after{content:"🍻";position:absolute;right:13px;bottom:-20px;font-size:94px;opacity:.10;transform:rotate(-13deg);pointer-events:none}
.lobby-badge{position:relative;z-index:1;padding:7px 13px;border-color:#e879f944;background:#c026d315;color:#f0abfc;letter-spacing:2.4px;box-shadow:0 0 22px #a855f714}
.lobby-hero h1{position:relative;z-index:1;font-size:clamp(29px,7vw,39px);margin:14px 0 8px;background:linear-gradient(95deg,#fff 15%,#e9d5ff 58%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.lobby-hero p{position:relative;z-index:1;font-size:14px;line-height:1.8;color:#b9bdd7}
.game-grid{gap:12px;margin:0 0 15px}
button.game-tile{min-height:182px;padding:17px 15px 16px;border-radius:21px;background:radial-gradient(circle at 100% 0%,var(--tile-glow),transparent 68%),linear-gradient(155deg,#171a31,#101326 78%);border-color:#ffffff14;box-shadow:0 10px 25px #0002,inset 0 1px #ffffff06;gap:8px}
.game-tile:last-child{min-height:145px;grid-column:1/-1}
.game-icon{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#ffffff13,#ffffff04);border-color:#ffffff14;font-size:29px;box-shadow:inset 0 1px #ffffff0a}
.game-title{font-size:18px;letter-spacing:-.2px}
.game-desc{font-size:12px;line-height:1.75;color:#b8bfd9}
.game-arrow{color:#d8b4fe;font-size:22px}
.lobby-note{padding:7px 4px;color:#777f9f;letter-spacing:.1px}
.status{border-radius:15px;background:linear-gradient(130deg,#171a30,#101326);border-color:#ffffff12;box-shadow:inset 0 1px #ffffff05}
.status.go{background:linear-gradient(120deg,#064e3b38,#0e292a);border-color:#34d3994a;color:#6ee7b7}
.queue{padding:14px 9px;border-radius:18px;background:#ffffff04;border:1px solid #ffffff09}
.queue span{border-radius:12px;background:#171b31;border-color:#ffffff12}
.queue span.now{background:linear-gradient(135deg,#f0abfc,#a78bfa);color:#171027;box-shadow:0 0 23px #c084fc3d}
.card{border:1px solid #ffffff60;box-shadow:0 22px 55px #0006,0 0 28px #a855f71a}
.card.back{background:repeating-linear-gradient(45deg,#7c3aed 0 12px,#6d28d9 12px 24px);box-shadow:0 0 0 7px #8b5cf612,0 20px 50px #0005}
.pc{border-radius:16px;transition:transform .18s,filter .18s}
.pc.back{background:radial-gradient(circle at 50% 0%,#a855f72e,transparent 80%),linear-gradient(145deg,#1b2040,#11152a);border-color:#a78bfa35}
.pc.safe{background:linear-gradient(145deg,#10b981,#047857);box-shadow:0 8px 22px #10b98125}
.pc.bad{background:linear-gradient(145deg,#fb7185,#be123c);box-shadow:0 0 25px #fb71854d}
.dice{border-color:#a78bfa42;border-radius:32px;background:radial-gradient(circle at 50% 0%,#a855f72a,transparent 80%),linear-gradient(145deg,#171a31,#0e1020);box-shadow:0 20px 45px #0004,0 0 30px #8b5cf714}
.words button{background:linear-gradient(135deg,#252044,#171a31);border-color:#a78bfa38;box-shadow:0 9px 22px #0002}
.words button.mine{background:linear-gradient(135deg,#7e22ce,#5b21b6);box-shadow:0 0 26px #a855f733}
button.stopbtn{box-shadow:0 0 0 8px #ffffff05,0 20px 45px #0006,0 0 30px #a855f71c}
.stopbtn.go{background:linear-gradient(145deg,#fb7185,#e11d48);box-shadow:0 0 0 8px #fb718511,0 0 40px #e11d4840}
table.res{border:1px solid #ffffff10;border-radius:16px}
.res th{background:#211d3d;color:#e9d5ff}
.modal{background:#03040bdc}
.box{background:radial-gradient(ellipse at 50% 0%,#a855f725,transparent 55%),linear-gradient(160deg,#20213b,#0e1122);border-color:#c084fc38;box-shadow:0 30px 100px #000b,0 0 40px #a855f71c}
.box img{background:#080a17;border:1px solid #ffffff12}
.box .dek{color:#fb7185;text-shadow:0 0 26px #fb718544}
.offline-box{background:linear-gradient(135deg,#351827,#211322);border-color:#fb718550}
button.clear-btn{background:linear-gradient(135deg,#e11d48,#be123c)}
/* Entry screen */
.join-shell{position:relative;margin:28px auto 0;padding:26px 21px 22px;border:1px solid #b07bff36;border-radius:28px;background:radial-gradient(ellipse at 100% 0%,#ec48991b,transparent 45%),radial-gradient(ellipse at 0% 100%,#7c3aed20,transparent 50%),linear-gradient(145deg,#17172d,#0e1020);box-shadow:0 24px 70px #0005,inset 0 1px #ffffff08;overflow:hidden}
.join-logo{width:74px;height:74px;margin:0 auto 14px;display:grid;place-items:center;border:1px solid #e879f94d;border-radius:24px;background:linear-gradient(145deg,#a855f72b,#ec48991b);font-size:39px;box-shadow:0 0 35px #a855f71d}
.join-title{text-align:center;font-size:clamp(30px,7vw,39px);font-weight:900;letter-spacing:-1px;background:linear-gradient(100deg,#fff,#e9d5ff 58%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.35}
.join-sub{text-align:center;color:#aeb4d1;font-size:13px;line-height:1.8;margin:6px 0 23px}
.join-label{display:block;color:#d9d9f3;font-size:13px;font-weight:700;margin:10px 2px 2px}
.join-shell input{margin:5px 0 10px}
.join-shell #go{margin-top:9px;min-height:55px;font-size:16px;box-shadow:0 10px 28px #a855f73a}
.join-foot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:19px 0 2px;color:#8289a8;font-size:11px}
.join-foot span{white-space:nowrap}
@media(hover:hover){button.game-tile:hover{transform:translateY(-4px);border-color:#c084fc65;box-shadow:0 16px 32px #0004,0 0 25px #a855f710}button:hover:not(:disabled){filter:brightness(1.08)}}

/* Clean, friendly polish — keep the original simple layout and game flow */

<script>

  { label: '1 เป๊ก', image: '/punish.png' },
  { label: '2 เป๊ก', image: '/punish.png' },
  { label: 'ยกกับคนขวา 1 เป๊ก', image: '/punish.png' },
  { label: 'ยกกับคนซ้าย 1 เป๊ก', image: '/punish.png' },
  { label: 'รอด', image: '/taboo-winner.png' },
  { label: 'เลือกคนยก 1 เป๊ก', image: '/punish.png' },
];
const BACKGROUND_MUSIC = ['/music-survive.mp3'];
const SETTINGS_KEY = 'partyAudioSettingsV2';
let settings = { musicEnabled: true, musicVolume: 15, gameSoundEnabled: true, gameSoundVolume: 100 };
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
  settings = { ...settings, ...saved };
  settings.musicVolume = Math.max(0, Math.min(100, Number(settings.musicVolume) || 0));
  settings.gameSoundVolume = Math.max(0, Math.min(100, Number(settings.gameSoundVolume) || 0));
} catch (e) {}


let currentPunishImage = PUNISH_IMAGES[0];
let gameMusic = null, currentMusicTrack = null, backgroundMusicIndex = 0, backgroundMusicActive = false, backgroundMusicGame = null;
let musicSyncElapsedMs = 0, musicSyncPerf = 0, musicNeedsInitialSync = false;
let activeWheelSoundKey = null, wheelSoundTimeout = null, wheelSoundStep = 0, lastWheelResultKey = null;

let prioritySoundQueue = [], priorityAudio = null, prioritySoundPlaying = false, resumeMusicAfterPriority = false, priorityPausedForWheel = false;
let lastTabooWinnerSoundKey = null;
const activeSoundOscillators = new Set();
function showDialog(message, confirmLabel = 'ตกลง', onConfirm = null) {
  let overlay = document.getElementById('noticeOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'noticeOverlay'; overlay.className = 'notice-overlay';
    overlay.innerHTML = '<section class="notice-card" role="alertdialog" aria-modal="true" aria-labelledby="noticeMessage"><div class="notice-icon">!</div><p id="noticeMessage" class="notice-message"></p><div class="notice-actions"><button type="button" class="alt" id="noticeCancel">ยกเลิก</button><button type="button" id="noticeConfirm">ตกลง</button></div></section>';

    document.body.appendChild(overlay);

  const cancel = overlay.querySelector('#noticeCancel'), confirmButton = overlay.querySelector('#noticeConfirm');
  cancel.style.display = onConfirm ? '' : 'none';
  confirmButton.textContent = confirmLabel;

function showConfirm(message, onConfirm, confirmLabel = 'ยืนยัน') { showDialog(message, confirmLabel, onConfirm); }
function closeNotice() { const overlay = document.getElementById('noticeOverlay'); if (overlay) overlay.remove(); }

function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
let activeClickSound = null;
function trackSoundOscillator(oscillator) {
  activeSoundOscillators.add(oscillator);
  oscillator.addEventListener('ended', () => activeSoundOscillators.delete(oscillator), { once: true });

function stopTransientGameSounds() {
  for (const oscillator of activeSoundOscillators) { try { oscillator.stop(); } catch (e) {} }
  activeSoundOscillators.clear();
}
function playNextPrioritySound() {
  if (activeWheelSoundKey) return;
  if (!prioritySoundQueue.length) {
    prioritySoundPlaying = false;
    priorityAudio = null;
    if (resumeMusicAfterPriority) { resumeMusicAfterPriority = false; syncGameMusic(); }
    return;
  }
  if (gameMusic && !gameMusic.paused) { resumeMusicAfterPriority = true; gameMusic.pause(); }
  stopTransientGameSounds();
  prioritySoundPlaying = true;
  const audio = new Audio(prioritySoundQueue.shift());
  priorityAudio = audio;
  audio.preload = 'auto';
  audio.volume = settings.gameSoundEnabled ? settings.gameSoundVolume / 100 : 0;
  let finished = false;

    if (finished) return;
    finished = true;
    audio.removeEventListener('ended', finish);
    audio.removeEventListener('error', finish);
    if (priorityAudio === audio) priorityAudio = null;
    prioritySoundPlaying = false;
    playNextPrioritySound();
  };
  audio.addEventListener('ended', finish);
  audio.addEventListener('error', finish);
  audio.play().catch(finish);

function queuePrioritySound(path) {
  if (!settings.gameSoundEnabled || settings.gameSoundVolume <= 0) return;
  prioritySoundQueue.push(path);
  if (!prioritySoundPlaying) playNextPrioritySound();

  if (activeClickSound) activeClickSound.played = true;
  if (activeWheelSoundKey || prioritySoundPlaying || !settings.gameSoundEnabled || settings.gameSoundVolume <= 0) return;

    unlockAudio(); if (!actx || actx.state !== 'running') return;
    const now = actx.currentTime;

function playWheelTick(step) {

  const now = actx.currentTime, volume = settings.gameSoundVolume / 100;
  const o = trackSoundOscillator(actx.createOscillator()), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(Math.max(240, 640 - step * 15), now);

  g.gain.exponentialRampToValueAtTime(.0001, now + .045);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now + .05);

function launchPartyBurst(kind) {

function stopGameMusic() {
  if (gameMusic) { gameMusic.pause(); gameMusic.currentTime = 0; }
  currentMusicTrack = null;
  backgroundMusicIndex = 0;
  backgroundMusicActive = false;
  backgroundMusicGame = null;
}
function alignSharedMusic(force = false) {
  if (!room || !gameMusic || !Number.isFinite(gameMusic.duration) || gameMusic.duration <= 0 || !musicSyncPerf) return;
  const elapsed = musicSyncElapsedMs + Math.max(0, performance.now() - musicSyncPerf);
  const target = (elapsed / 1000) % gameMusic.duration;
  if (force || musicNeedsInitialSync || Math.abs(gameMusic.currentTime - target) > 1.25) {
    try { gameMusic.currentTime = target; musicNeedsInitialSync = false; } catch (e) {}
  }
}
function syncGameMusic(game = room?.game) {
  backgroundMusicActive = Boolean(settings.musicEnabled);
  backgroundMusicGame = game || 'lobby';
  if (!backgroundMusicActive) { stopGameMusic(); return; }
  if (prioritySoundPlaying || prioritySoundQueue.length) { if (gameMusic && !gameMusic.paused) gameMusic.pause(); return; }
  if (!gameMusic) {
    gameMusic = new Audio();
    gameMusic.loop = true;
    gameMusic.preload = 'none';
    gameMusic.addEventListener('loadedmetadata', () => alignSharedMusic(true));
    gameMusic.addEventListener('timeupdate', () => alignSharedMusic(false));
    gameMusic.addEventListener('ended', () => {
      if (!backgroundMusicActive || !settings.musicEnabled) return;
      backgroundMusicIndex = (backgroundMusicIndex + 1) % BACKGROUND_MUSIC.length;
      currentMusicTrack = null;
      syncGameMusic(backgroundMusicGame);
    });
  }
  const track = BACKGROUND_MUSIC[backgroundMusicIndex];
  if (currentMusicTrack !== track) {
    gameMusic.pause(); gameMusic.src = track; gameMusic.load(); gameMusic.currentTime = 0; currentMusicTrack = track;
  }
  gameMusic.volume = Math.min(100, settings.musicVolume) / 100;
  alignSharedMusic(false);
  if (gameMusic.paused) gameMusic.play().catch(() => {});
}

      const rect=slider.getBoundingClientRect();
      const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      slider.value=Math.round(Number(slider.min||0)+ratio*(Number(slider.max||100)-Number(slider.min||0)));
      slider.dispatchEvent(new Event('input',{bubbles:true}));
    };
    slider.addEventListener('pointerdown',event=>{

      try{slider.setPointerCapture(event.pointerId);}catch(e){}
      updateFromPointer(event);
      event.preventDefault();
    });
    slider.addEventListener('pointermove',event=>{if(dragging){updateFromPointer(event);event.preventDefault();}});

let actx = null;
function unlockAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') {
      actx.resume();
      const src = actx.createBufferSource();
      src.buffer = actx.createBuffer(1, 1, 22050);
      src.connect(actx.destination);
      src.start(0);
    }
  } catch (e) {}
}
document.addEventListener('pointerdown', () => { unlockAudio(); syncGameMusic(); });
document.addEventListener('touchend', unlockAudio);
document.addEventListener('click', event => {
  const control = event.target.closest('button,a[href],[role="button"],[role="link"],[onclick],input[type="checkbox"],input[type="radio"],input[type="range"],select,summary');
  if (!control || control.disabled || control.getAttribute('aria-disabled') === 'true') return;
  const clickSound = { played: false };
  activeClickSound = clickSound;
  queueMicrotask(() => {
    if (!clickSound.played) sfx('tap');

  });
}, true);

function beep(when, dur, freq) {
  if (activeWheelSoundKey || prioritySoundPlaying || prioritySoundQueue.length) return null;
  const o = trackSoundOscillator(actx.createOscillator()), g = actx.createGain();
  o.type = 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  const volume = (settings.gameSoundEnabled ? settings.gameSoundVolume : 0) / 100;
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.25 * volume), when + 0.01);
  g.gain.setValueAtTime(Math.max(0.0001, 0.25 * volume), when + dur - 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g);
  g.connect(actx.destination);
  o.start(when);
  o.stop(when + dur + 0.02);
  return o;
}

const LEAD = 60;
const COUNT_MS = 2850;
const tm = { roundId: null, phase: 'idle', count: '', goAt: 0, timers: [], osc: [] };

function clearTimers() {
  tm.timers.forEach(clearTimeout);
  tm.timers = [];
  tm.osc.forEach(o => { try { o.stop(); } catch (e) {} });
  tm.osc = [];
}
const rerenderTimer = () => { if (room?.game === 'timer') render(); };

function startCountdown() {
  clearTimers();
  unlockAudio();
  const t0 = performance.now() + LEAD;
  tm.goAt = t0 + COUNT_MS;
  tm.phase = 'count';
  tm.count = '3';
  if (actx && actx.state === 'running') {
    const t = actx.currentTime + LEAD / 1000;
    tm.osc = [beep(t, 0.15, 880), beep(t + 1, 0.15, 880), beep(t + 2, 0.8, 1320)];
  }
  tm.timers.push(setTimeout(() => { tm.count = '2'; rerenderTimer(); }, LEAD + 1000));
  tm.timers.push(setTimeout(() => { tm.count = '1'; rerenderTimer(); }, LEAD + 2000));
  tm.timers.push(setTimeout(() => { tm.phase = 'go'; rerenderTimer(); }, LEAD + COUNT_MS));
}

function stopTime(e) {
  const now = performance.now();
  if (e) e.preventDefault();
  if (tm.phase !== 'go') return;
  tm.phase = 'sent';
  emit('timer:stop', Math.max(0, now - tm.goAt));
  render();
}

function getLoss() {
  if (!room) return null;
  const s = room.state;

  if (room.game === 'survive' && s.loser) {
    return { key: 'survive:' + s.roundId, people: [{ id: s.loser.id, name: s.loser.name }] };
  }

  if (room.game === 'word' && s.result?.type === 'lose') {
    const r = s.result;
    return {
      key: 'word:' + s.set.cat + ':' + r.reveal.map(x => x.name + '=' + x.word).join('|'),
      people: r.losers.map(n => ({
        id: room.players.find(p => p.name === n)?.id,
        name: n,
        sub: 'กด "' + esc(r.reveal.find(x => x.name === n)?.word || '') + '"',
      })),
    };
  }

  if (room.game === 'timer' && s.phase === 'result' && s.outcome.losers.length) {
    const o = s.outcome;
    const people = o.rows.filter(r => o.losers.includes(r.name)).map(r => ({
      id: room.players.find(p => p.name === r.name)?.id,
      name: r.name,
      sub: r.ms == null ? '—' : `${secs(r.ms)} วิ`,
    }));
    const myName = room.players.find(p => p.id === myId)?.name;
    const me = o.rows.find(r => r.name === myName);
    let mine = '';
    if (me && !o.losers.includes(me.name)) {
      mine = me.ms == null ? '—' : `${secs(me.ms)} วิ`;
    }
    return { key: 'timer:' + s.roundId, people, mine };
  }

  return null;
}

  // ---------- เปิดไพ่ ----------
  if (room.game === 'cards') {
    const myTurn = s.turn === myId;
    const turnName = room.players.find(p => p.id === s.turn)?.name || '';
    h += `<h2 class="game-heading"><img class="game-heading-art" src="/game-cards.png" alt="">เปิดไพ่</h2><div class="center muted">เหลือ ${s.remaining}/52 ใบ</div>
      <div class="queue">คิว: ${queueHtml(online, s.turn)}</div>`;
    if (s.current) {
      h += `<div class="card ${isRed(s.current) ? 'red' : ''}"><div>${s.current.r}</div><div>${s.current.s}</div></div>
            <div class="center muted">เปิดโดย ${esc(s.flippedBy)}</div>`;
    } else {
      h += `<div class="card back"></div>`;
    }
    if (s.history.length > 1) {
      h += `<div class="hist">${s.history.slice(1).map(c => `<span class="${isRed(c) ? 'red' : ''}">${c.r}${c.s}</span>`).join('')}</div>`;
    }
    if (s.remaining > 0 && myTurn) {
      h += `<div class="status go">👉 ตาคุณเปิดไพ่!</div><button onclick="sfx('card');emit('cards:flip')">เปิดไพ่</button>`;
    } else if (s.remaining > 0) {
      h += `<div class="status">⏳ ตาของ ${esc(turnName)}</div><button class="alt" onclick="skipTurn('cards')">⏭ ข้ามคิว</button>`;
    } else h += `<div class="msg">หมดสำรับ จบเกม! 🎉</div>`;
    h += `<button class="alt" onclick="showConfirm('สับไพ่ใหม่?',()=>emit('cards:reset'),'สับไพ่ใหม่')">🔄 สับไพ่ใหม่</button>`;
  }

  // ---------- รอดหรือร่วง ----------
  if (room.game === 'survive') {
    if (seenRound !== s.roundId) { seen = new Set(); seenRound = s.roundId; }
    h += `<h2 class="game-heading"><img class="game-heading-art" src="/game-survive.png" alt="">รอดหรือร่วง</h2>`;
    if (s.setup) {
      h += `<div class="center muted">เลือกจำนวนไพ่สำหรับรอบนี้</div>
        <div class="deck-options">
          <button onclick="sfx('card');emit('survive:start',16)">16 ใบ<small>วงเล็ก</small></button>
          <button onclick="sfx('card');emit('survive:start',32)">32 ใบ<small>วงกลาง</small></button>
          <button onclick="sfx('card');emit('survive:start',48)">48 ใบ<small>วงใหญ่</small></button>
        </div>`;
    } else {
    const myTurn = !s.loser && s.turn === myId;
    const turnName = room.players.find(p => p.id === s.turn)?.name || '';
    const openedMap = {};
    s.opened.forEach(o => openedMap[o.i] = o);

    h += `<div class="center muted">เปิดไปแล้ว ${s.opened.length}/${s.total} ใบ</div>
      <div class="queue">คิว: ${queueHtml(online, s.loser ? null : s.turn)}</div>
      <div class="grid">`;
    for (let i = 0; i < s.total; i++) {
      const o = openedMap[i];
      if (o) {
        const bad = s.loser?.card === i;
        h += `<button class="pc ${bad ? 'bad' : 'safe'} ${seen.has(i) ? '' : 'flip'}" disabled>
                <span>${bad ? '😵‍💫' : '😎'}</span><small>${esc(o.name)}</small></button>`;
      } else {
        h += `<button class="pc back" ${myTurn ? '' : 'disabled'} onclick="pickCard(${i})">?</button>`;
      }
    }
    h += `</div>`;

    if (s.loser) {
      h += `<div class="msg lose">😵‍💫 ${esc(s.loser.name)} ร่วง!</div>
            <button onclick="emit('survive:reset')">ตาใหม่</button>`;
    } else if (myTurn) {
      h += `<div class="status go">👉 ตาคุณ! เลือกมา 1 ใบ</div>`;
    } else {
      h += `<div class="status">⏳ ตาของ ${esc(turnName)}</div>
            <button class="alt" onclick="skipTurn('survive')">⏭ ข้ามคิว</button>`;
    }
    }
  }

  // ---------- ลูกเต๋า ----------
  if (room.game === 'dice') {
    const myTurn = s.turn === myId;
    const turnName = room.players.find(p => p.id === s.turn)?.name || '';
    h += `<h2 class="game-heading"><img class="game-heading-art" src="/game-dice.png" alt="">ทอยลูกเต๋า</h2>
      <div class="queue">คิว: ${queueHtml(online, s.turn)}</div>
      <div class="center"><div class="dice" id="dice">${s.value ? DICE[s.value] : '🎲'}</div>
      <div class="msg" id="diceText">${s.value ? `ได้ ${s.value}` : 'รอทอย'}</div>
      ${s.by ? `<div class="muted">ทอยโดย ${esc(s.by)}</div>` : ''}</div>`;
    h += myTurn
      ? `<div class="status go">👉 ตาคุณทอย!</div><button id="rollBtn" onclick="rollDice()">🎲 ทอย!</button>`
      : `<div class="status">⏳ ตาของ ${esc(turnName)}</div>
         <button class="alt" onclick="skipTurn('dice')">⏭ ข้ามคิว</button>`;
  }

  // ---------- คำเดียวกัน ----------
  if (room.game === 'word') {
    const iPicked = s.pickedIds.includes(myId);
    if (!iPicked && !s.result) myPick = null;
    const pickedOnline = s.pickedIds.filter(id => onlineIds.includes(id)).length;
    h += `<h2 class="game-heading"><img class="game-heading-art" src="/game-word.png" alt="">กดคำเดียวกัน</h2><div class="center muted">หมวด: ${esc(s.set.cat)}</div>
      <div class="words">${s.set.words.map((w, i) =>
        `<button class="${myPick === i ? 'mine' : ''}" ${iPicked || s.result ? 'disabled' : ''} onclick="pickWord(${i})">${esc(w)}</button>`
      ).join('')}</div>
      <div class="center muted">กดแล้ว ${pickedOnline}/${online.length} คน</div>`;
    if (online.length < 3) h += `<div class="center muted">⚠️ เกมนี้ต้องมี 3 คนขึ้นไป</div>`;
    if (s.result) {
      const r = s.result;
      if (r.type === 'lose') h += `<div class="msg lose">🍺 เชิญยกจ้า: ${r.losers.map(esc).join(', ')}</div>`;
      if (r.type === 'allSame') h += `<div class="msg">เหมือนกันหมด! เริ่มคำใหม่...</div>`;
      if (r.type === 'tie') h += `<div class="msg">ไม่มีใครแพ้ เริ่มคำใหม่...</div>`;
      h += `<div class="center muted">${r.reveal.map(x => `${esc(x.name)} → ${esc(x.word)}`).join('<br>')}</div>`;
      if (r.type === 'lose') h += `<button onclick="emit('word:next')">คำต่อไป</button>`;
    }
  }

  // ---------- คำต้องห้าม ----------
  if (room.game === 'taboo') {
    h += `<h2 class="game-heading taboo-heading"><img class="game-heading-art" src="/game-taboo.png" alt="">คำต้องห้าม</h2>`;
    if (s.winner) {
      tabooWinnerOverlay = `<div class="taboo-winner-overlay"><div class="taboo-winner-card" role="status" aria-live="polite"><div class="winner-kicker">✦ 🏆 ผู้ชนะคนสุดท้าย 🏆 ✦</div><img src="/taboo-winner.png" alt=""><div class="taboo-winner-name">${esc(s.winner.name)}</div><div class="taboo-winner-text">เป็นผู้ชนะ</div><button onclick="emit('taboo:next')">เล่นอีกรอบ</button></div></div>`;
    } else if (!s.isParticipant) {
      const waitingText = s.status === 'mode' ? 'กำลังเลือกโหมด' : s.status === 'setup' ? `รอทุกคนกำหนดคำ · ${s.submittedCount}/${s.participantCount}` : s.status === 'playing' ? 'คุณยอมแพ้แล้ว · รอผู้ชนะ' : 'เริ่มรอบใหม่เพื่อรับคำ';
      h += `<div class="taboo-status">${waitingText}</div>`;
      if (s.status === 'ended') h += `<button onclick="emit('taboo:next')">${s.mode === 'custom' ? 'กำหนดคำรอบใหม่' : 'สุ่มคำรอบใหม่'}</button>`;
    } else if (s.status === 'mode') {
      h += `<section class="taboo-mode-panel"><h3>เลือกโหมดเล่น</h3><div class="taboo-mode-options"><button onclick="emit('taboo:mode','random')">ระบบสุ่มคำ</button><button class="alt" onclick="emit('taboo:mode','custom')">กำหนดคำเอง</button></div></section>`;
    } else if (s.status === 'setup') {
      h += `<section class="taboo-setup-panel"><h3>${s.hasSubmitted ? 'ส่งคำแล้ว' : 'กำหนดคำของคุณ'}</h3>${s.hasSubmitted ? `<div class="taboo-progress">รอผู้เล่นที่เหลือ · ${s.submittedCount}/${s.participantCount}</div>` : `<input id="tabooCustomWord" type="text" maxlength="40" autocomplete="off" placeholder="พิมพ์คำที่ต้องห้าม" onkeydown="if(event.key==='Enter')document.getElementById('tabooSubmitWord').click()"><button id="tabooSubmitWord" onclick="emit('taboo:submitWord',document.getElementById('tabooCustomWord').value)">เสร็จ</button><div class="taboo-progress">กำหนดคำแล้ว ${s.submittedCount}/${s.participantCount} คน</div>`}</section>`;
    } else {
      h += `<div class="taboo-card" aria-label="คำของคุณ"><div class="taboo-word-area"><span class="taboo-word">${esc(s.myWord || '')}</span></div>${s.status === 'playing' ? `<button class="taboo-lose" aria-label="ยอมแพ้" title="ยอมแพ้" onclick="tabooConfirmOpen=true;render()">ยอม</button>` : ''}</div>`;
      if (s.status !== 'playing') {
        h += `<div class="taboo-status ended">จบรอบแล้ว · ${s.losers.map(p => `${esc(p.name)} พูดคำว่า “${esc(p.word)}”`).join(', ')}</div>
          <button onclick="emit('taboo:next')">${s.mode === 'custom' ? 'กำหนดคำรอบใหม่' : 'สุ่มคำรอบใหม่'}</button>`;
      }
      if (online.length < 2) h += `<div class="center muted">เกมนี้เหมาะกับผู้เล่น 2 คนขึ้นไป</div>`;
    }
    if (tabooConfirmOpen && s.status === 'playing' && s.isParticipant) {
      h += `<div class="taboo-confirm"><div class="taboo-confirm-box" role="dialog" aria-modal="true" aria-labelledby="tabooConfirmTitle">
        <h3 id="tabooConfirmTitle">ยืนยันการยอมแพ้</h3><p>คุณเผลอพูดคำว่า “${esc(s.myWord || '')}” แล้วใช่ไหม?</p>
        <button class="taboo-lose" onclick="tabooConfirmOpen=false;emit('taboo:lose')">ยืนยัน ยอมแพ้</button>
        <button class="alt" onclick="tabooConfirmOpen=false;render()">ยังไม่ใช่ กลับไปเล่น</button>
      </div></div>`;
    }
  }

  // ---------- หยุดเวลา ----------
  if (room.game === 'timer') {
    const inRound = s.participants.includes(myId);
    const pressed = s.pressedIds.includes(myId) || (tm.roundId === s.roundId && tm.phase === 'sent');

    if (s.phase === 'running' && tm.roundId !== s.roundId) {
      tm.roundId = s.roundId;
      if (inRound && !pressed) startCountdown();
      else { clearTimers(); tm.phase = 'watch'; }
    }
    if (s.phase !== 'running' && (tm.phase === 'count' || tm.phase === 'go')) { clearTimers(); tm.phase = 'idle'; }

    let mode;
    if (s.phase !== 'running') mode = 'idle';
    else if (!inRound) mode = 'watch';
    else if (pressed) mode = 'sent';
    else mode = (tm.phase === 'count' || tm.phase === 'go') ? tm.phase : 'watch';

    h += `<h2 class="game-heading"><img class="game-heading-art timer-heading-art" src="/game-timer.png" alt="">หยุดเวลา</h2>`;
    if (s.phase === 'idle') {
      h += `<div class="center muted" style="margin:14px 0;line-height:1.7">
        ระบบจะสุ่มเวลา 1–15 วิ<br>
        ฟังเสียง ตุ๊ด · ตุ๊ด · ตี้ดดด แล้วเริ่มนับในใจ<br>
        กดหยุดให้ใกล้เวลาที่สุด ใครห่างสุด โดน! 🍺<br>
        <small>ถ้าไม่มีเสียง แตะหน้าจอ 1 ครั้งก่อนเริ่ม และเปิดเสียงมือถือ</small></div>`;
    } else {
      h += `<div class="target">เป้าหมาย<b>${s.target} วิ</b></div>`;
    }

    if (mode === 'count') {
      h += `<div class="stopwrap"><button class="stopbtn count" disabled>${tm.count}</button></div>
            <div class="status">เตรียมตัว...</div>`;
    } else if (mode === 'go') {
      h += `<div class="stopwrap"><button class="stopbtn go" onpointerdown="stopTime(event)">หยุด!</button></div>
            <div class="status go">นับในใจ แล้วกด!</div>`;
    } else if (mode === 'sent') {
      h += `<div class="stopwrap"><button class="stopbtn sent" disabled>✅ กดแล้ว<br>รอเพื่อน</button></div>`;
    } else if (mode === 'watch') {
      h += `<div class="stopwrap"><button class="stopbtn watch" disabled>รอบนี้คุณ<br>ไม่ได้เล่น<br>รอรอบหน้า</button></div>`;
    }

    if (s.phase === 'running') {
      h += `<div class="center muted">กดแล้ว ${s.pressedIds.length}/${s.participants.length} คน · เริ่มโดย ${esc(s.startedBy)}</div>`;
    }

    if (s.phase === 'result') {
      const o = s.outcome;
      h += `<div class="msg lose">⏱️ ห่างสุด: ${o.losers.map(esc).join(', ') || '-'}</div>
        <table class="res"><tr><th>#</th><th>ชื่อ</th><th>เวลา</th></tr>
        ${o.rows.map((r, i) => {
          const lost = o.losers.includes(r.name);
          const cls = lost ? 'loser' : i === 0 ? 'best' : '';
          const t = r.ms == null ? '—' : secs(r.ms) + ' วิ';
          return `<tr class="${cls}"><td>${lost ? '🍺' : i === 0 ? '🏆' : i + 1}</td><td>${esc(r.name)}</td><td>${t}</td></tr>`;
        }).join('')}
        </table>`;
    }

    if (s.phase !== 'running') {
      if (online.length < 2) h += `<div class="center muted">⚠️ เกมนี้ต้องมี 2 คนขึ้นไป</div>`;
      h += `<button onclick="emit('timer:start')">▶️ ${s.phase === 'result' ? 'เล่นอีกรอบ' : 'เริ่ม'}</button>`;
    }
  }

  if (room.game === 'taboo') h += '</div>';
  h += tabooWinnerOverlay;

  // ---------- หน้าลงโทษ ----------
  const loss = getLoss();
  if (loss && closedKey !== loss.key) {
    const anim = shownKey !== loss.key;
    shownKey = loss.key;
    if (lastLossKey !== loss.key) currentPunishImage = PUNISH_IMAGES[Math.floor(Math.random() * PUNISH_IMAGES.length)];
    const spin = room.punishmentRoll?.key === loss.key ? room.punishmentRoll : null;
    const personNames = loss.people.map(p => `<div class="name loss-name">${esc(p.name)}</div>${p.sub ? `<div class="ltime">${p.sub}</div>` : ''}`).join('');
    let punishmentContent = '';
    let actions = '';
    if (spin?.status === 'spinning') {
      const spinElapsed = Math.min(3.8, Math.max(0, (performance.now() - wheelVisualStartedAt) / 1000));
      punishmentContent = `<div class="roulette-stage spinning-stage"><div class="roulette-pointer">▼</div><div class="roulette-wheel spinning" style="--wheel-end:${spin.rotation}deg;--spin-delay:-${spinElapsed.toFixed(3)}s"><span class="roulette-label">1 เป๊ก</span><span class="roulette-label">2 เป๊ก</span><span class="roulette-label">ยกกับขวา</span><span class="roulette-label">ยกกับซ้าย</span><span class="roulette-label">รอด</span><span class="roulette-label">เลือกคน</span></div></div><div class="roulette-caption">กำลังเสี่ยงดวง…</div>`;
    } else if (spin?.status === 'result' && ROULETTE_OUTCOMES[spin.outcome]) {
      const outcome = ROULETTE_OUTCOMES[spin.outcome];
      const resultText = outcome.label.split('·')[0].trim();
      punishmentContent = `<img class="roulette-result-image ${spin.outcome === 4 ? 'safe-outcome' : ''}" src="${outcome.image}" alt="${esc(outcome.label)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">🥃</div>${resultText ? `<div class="roulette-result-text">${esc(resultText)}</div>` : ''}`;
      actions = `<button onclick="closeModal()">ยอมรับชะตา</button>`;
    } else {
      punishmentContent = `<img src="${currentPunishImage}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">👉😆👈</div><div class="dek">เชิญยกจ้า</div>`;
      actions = `<div class="loss-actions"><button class="fate-btn" onclick="closeModal()">ยอมรับชะตา</button><button class="risk-btn" onclick="spinPunishment()">เสี่ยงดวง</button></div>`;
    }
    h += `<div class="modal ${spin?.status === 'spinning' ? 'wheel-active' : ''}"><div class="box loss-box ${anim ? 'anim' : ''}">
      <div class="punishment-kicker">✦ บทลงโทษ ✦</div>
      ${spin?.status === 'result' ? '' : personNames}
      ${punishmentContent}
      ${loss.mine ? `<div class="mytime">${loss.mine}</div>` : ''}
      ${actions}
    </div></div>`;
  }

  app.innerHTML = h;

  if (room.game === 'taboo') requestAnimationFrame(fitTabooWord);

  if (room.game === 'dice' && s.rollId !== lastRollId) {
    lastRollId = s.rollId;
    if (s.value) {
      const el = document.getElementById('dice'), t = document.getElementById('diceText');
      t.textContent = 'กำลังทอย...';
      const iv = setInterval(() => el.textContent = DICE[1 + Math.floor(Math.random() * 6)], 70);
      setTimeout(() => { clearInterval(iv); el.textContent = DICE[s.value]; t.textContent = `ได้ ${s.value}`; }, 800);
    }
  }

  if ((room.game === 'survive' || room.game === 'dice') && s.turn === myId && !s.loser) {
    const key = room.game + ':' + (s.roundId || '') + ':' + (s.opened ? s.opened.length : s.rollId);
    if (lastTurnKey !== key) { lastTurnKey = key; sfx('tap'); }
  }

  if (room.game === 'survive') s.opened.forEach(o => seen.add(o.i));

  const someoneLost = (loss && lastLossKey !== loss.key);
  if (someoneLost) {
    lastLossKey = loss.key;
    document.body.classList.remove('flash'); void document.body.offsetWidth;
    document.body.classList.add('flash');
    if (room.game !== 'taboo') sfx('loss');
  }
  if (room.game === 'taboo' && s.losers?.length) {
    if (s.winner) {
      const winnerKey = `taboo-winner:${s.roundId}:${s.winner.id || s.winner.name}`;
      if (lastTabooWinnerSoundKey !== winnerKey) {
        lastTabooWinnerSoundKey = winnerKey;
        launchPartyBurst('win');
        sfx('win');
      }
    }
  }
}

// ================= ปุ่มต่างๆ =================
function pickCard(i) {
  sfx('card');
  document.querySelectorAll('.pc.back').forEach(b => b.disabled = true);
  emit('survive:pick', i);
}
function rollDice() {
  sfx('dice');
  const b = document.getElementById('rollBtn');
  if (b) b.disabled = true;
  emit('dice:roll');
}
function skipTurn(game) {
  const name = room.players.find(p => p.id === room.state.turn)?.name || '';
  showConfirm('ข้ามคิว ' + name + '?', () => emit(game + ':skip'), 'ข้ามคิว');
}
function pickWord(i) { myPick = i; emit('word:pick', i); }
function canUsePunishmentAction(action, loss = getLoss()) {
  if (!loss) return false;
  if (loss.people.some(person => person.id === myId)) return true;
  const names = loss.people.map(person => person.name).join(' และ ');
  showPunishmentPermissionNotice(action, names);
  return false;
}
function spinPunishment() {
  const loss = getLoss();
  if (!canUsePunishmentAction('เสี่ยงดวง', loss)) return;
  sfx('dice');
  emit('punishment:spin', loss.key);
}
function closeModal() {
  
  prioritySoundQueue = [];
  if (priorityAudio) {
    priorityAudio.pause();
    priorityAudio.currentTime = 0;
    priorityAudio = null;
  }
  prioritySoundPlaying = false;
  priorityPausedForWheel = false;
  resumeMusicAfterPriority = false;
  stopTransientGameSounds();
  const l = getLoss();
  if (l) closedKey = l.key;
  render();
}
function leaveRoom() { showConfirm('ออกจากห้อง?', leaveRoomConfirmed, 'ออกจากห้อง'); }
function leaveRoomConfirmed() {  emit('leave');
  clearTimers();
  joined = false;
  room = null;
  renderJoin();
}
async function shareRoom() {
  const url = new URL(location.href);
  if (room?.code) url.searchParams.set('room', room.code);
  try {
    if (navigator.share) {
      await navigator.share({ title: 'มาเล่นเกมด้วยกัน', text: `เข้าห้อง ${room?.code || ''} มาเล่นด้วยกัน!`, url: url.href });
      return;
    }
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url.href);
      showNotice('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย');
      return;
    }
    prompt('คัดลอกลิงก์นี้ส่งให้เพื่อน', url.href);
  } catch (error) {
    if (error.name !== 'AbortError') prompt('คัดลอกลิงก์นี้ส่งให้เพื่อน', url.href);
  }
}

socket.on('you', id => { myId = id; sessionStorage.setItem('pid', id); });
socket.on('room', r => { if (!joined) return; const roomChanged = !room || room.code !== r.code; const previousRoll = room?.punishmentRoll; const newWheelSpin = r.punishmentRoll?.status === 'spinning' && (previousRoll?.key !== r.punishmentRoll.key || previousRoll?.status !== 'spinning'); room = r; musicSyncElapsedMs = Number(r.musicElapsedMs) || 0; musicSyncPerf = performance.now(); if (roomChanged) musicNeedsInitialSync = true; if (newWheelSpin) closedKey = null; render(); });
socket.on('err', m => showNotice(m));
socket.on('connect', () => {
  const code = new URLSearchParams(location.search).get('room');
  const name = localStorage.getItem('name');
  if (joined && code && name) emit('join', { code, name, pid: myId });
});

renderJoin();
</script>
